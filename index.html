<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fan Hub Plus</title>
    <meta name="description" content="The premier fandom platform for Anime, Gaming, Movies, TV Shows, K-Pop, Comics, Manga, and Cosplay." />
    <meta property="og:title" content="Fan Hub Plus" />
    <meta property="og:description" content="The premier fandom platform for Anime, Gaming, Movies, TV Shows, K-Pop, Comics, Manga, and Cosplay." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Prevent White Flash on Refresh (Instant Theme Sync) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('fan-hub-theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    
    <style>
      html, body {
        background-color: #060913;
        color: #f8fafc;
      }
      html:not(.dark), html:not(.dark) body {
        background-color: #f1f4f9;
        color: #0f172a;
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#060913] text-[#f8fafc]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
